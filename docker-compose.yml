# Production stack for a single VPS (PRD §4).
# 1) cp .env.example .env  and fill every value (POSTGRES_PASSWORD too)
# 2) docker compose build
# 3) docker compose run --rm migrate
# 4) docker compose up -d app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kreatim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kreatim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreatim"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kreatim:${POSTGRES_PASSWORD}@db:5432/kreatim
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kreatim:${POSTGRES_PASSWORD}@db:5432/kreatim
    depends_on:
      db: { condition: service_healthy }
    # Only reachable from the host; put Caddy/Nginx in front for HTTPS.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
